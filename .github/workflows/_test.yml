name: Test Suite

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions to test"
        required: true
        type: string
      scope:
        description: "JSON array of scopes to run"
        required: true
        type: string

jobs:
  test:
    name: ${{ matrix.python }} / ${{ matrix.scope }}
    strategy:
      matrix:
        python: ${{ fromJson(inputs.python-versions) }}
        scope: ${{ fromJson(inputs.scope) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync
      - name: Install chrome-headless-shell
        if: matrix.scope == 'pytest'
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Detected Chrome version: $CHROME_VERSION"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-headless-shell-linux64.zip"
          unzip -q chrome-headless-shell-linux64.zip
          chmod +x chrome-headless-shell-linux64/chrome-headless-shell
          echo "CHROME_BINARY_LOCATION=$PWD/chrome-headless-shell-linux64/chrome-headless-shell" >> $GITHUB_ENV
      - name: ${{ matrix.python }} / ${{ matrix.scope }}
        if: matrix.scope == 'pytest'
        run: uv run pytest
      - uses: actions/upload-artifact@v6
        if: matrix.scope == 'pytest' && failure()
        with:
          name: screenshots-${{ matrix.python }}
          path: screenshots/*.failed.png
          retention-days: 14
      - name: ${{ matrix.python }} / ${{ matrix.scope }}
        if: matrix.scope == 'startup'
        run: ./test_startup.sh
      - name: Restore dependencies for effective caching
        if: matrix.scope == 'startup' && always()
        run: uv sync
